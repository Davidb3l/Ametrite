name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Keep this ref in lockstep with rust-toolchain.toml — the action
      # overrides the file, and a floating `stable` here once let a new
      # rustfmt drift the tree and break the fmt gate.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      # verify the web app bundles (server + frontend) without errors
      - run: bun build apps/web/server.ts --target bun --outdir /tmp/build

  dco:
    # Every PR commit must carry a DCO sign-off (CONTRIBUTING.md). Mirrors the
    # Hayvenhurst check; PR-only, since main only receives merged PRs.
    name: DCO sign-off check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer."
              echo "  Subject: $(git log -1 --format=%s "$sha")"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing commit(s) without DCO sign-off. Run 'git commit --amend -s' (or rebase with --signoff) and force-push."
            exit 1
          fi
          echo "All commits carry a Signed-off-by trailer."

  bench:
    # Perf-budget gate: seed 10k issues and fail if a hot read path regresses
    # past its budget (list/search/claim <15ms, context <50ms). Release build,
    # median of many iterations to smooth CI scheduler noise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release --example bench
